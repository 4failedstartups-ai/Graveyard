<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Site editor</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--tx:#e8eaf0;--mut:#8b93a5;--ac:#e0b04a;--bad:#e5645a;--ok:#5cc28a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:16px;margin:0;flex:1}
nav{display:flex;gap:4px;padding:10px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:none;border:1px solid var(--line);color:var(--mut);padding:7px 14px;border-radius:8px;cursor:pointer}
nav button.on{color:#111;background:var(--ac);border-color:var(--ac)}
nav .badge{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:6px}
main{padding:20px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
input,select,textarea{width:100%;background:#0c0e12;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:90px;resize:vertical}label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
button.b{background:var(--ac);color:#111;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
button.g{background:none;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer}
button.d{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:7px 12px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:12px}
.mut{color:var(--mut)}h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ac)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}#login{max-width:340px;margin:12vh auto}.pill{padding:2px 8px;border-radius:9px;font-size:11px;border:1px solid var(--line)}
img.ph{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#222}
</style></head><body>
<div id="login" class="card" hidden>
  <h1 style="font-size:18px">Admin sign in</h1>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <p class="row"><button class="b" id="go">Sign in</button><span id="lerr" style="color:var(--bad)"></span></p>
</div>
<div id="app" hidden>
<header><h1>Site editor</h1><span class="mut" id="who"></span><button class="g" id="out">Sign out</button></header>
<nav id="tabs"></nav><main id="view"></main></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== PASTE the same two values you use in data.js ===== */
const SB_URL = 'https://uveospgmehgarerlquav.supabase.co';
const SB_KEY = 'PASTE_YOUR_ANON_KEY_HERE';
/* ======================================================== */
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m, bad){const t=$('#toast');t.textContent=m;t.style.borderColor=bad?'var(--bad)':'var(--ok)';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function drive(u){const m=/\/d\/([\w-]+)/.exec(u||'')||/[?&]id=([\w-]+)/.exec(u||'');return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w600`:(u||'')}

const GROUPS = {
  'Hero & home':['site_name','tagline','hero_eyebrow','hero_title','hero_accent','hero_subtext','cta1_label','cta1_url','cta2_label','cta2_url'],
  'Page titles':['about_title','about_intro','team_title','team_intro','contact_title','contact_intro','terms_title','terms_intro','privacy_title','privacy_intro','legal_updated'],
  'Contact':['contact_email','contact_phone','address','contact_form_url'],
  'Social':['linkedin','twitter','instagram','youtube','facebook'],
  'Brand & footer':['logo_url','footer_blurb','copyright']
};
const TABS = {settings:'Settings',nav:'Navigation',pages:'Pages',team:'Team',highlights:'Highlights',misses:'Missed searches'};
let tab = 'settings';

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return showLogin();
  const {data:ok} = await sb.rpc('is_admin');
  if(!ok){await sb.auth.signOut();showLogin('This account is not an admin.');return}
  $('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=session.user.email;
  renderTabs();show(tab);
}
function showLogin(msg){$('#app').hidden=true;$('#login').hidden=false;$('#lerr').textContent=msg||''}
$('#go').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#lerr').textContent='Wrong email or password';return}boot()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#out').onclick=async()=>{await sb.auth.signOut();showLogin()};

async function renderTabs(){
  const {count}=await sb.from('search_misses').select('term',{count:'exact',head:true}).eq('status','new');
  $('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-k="${k}" class="${k===tab?'on':''}">${v}${k==='misses'&&count?`<span class="badge">${count}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;renderTabs();show(tab)});
}
function show(k){$('#view').innerHTML='<p class="mut">Loading…</p>';({settings,nav,pages,team,highlights,misses})[k]()}

/* ---------- Settings ---------- */
async function settings(){
  const {data,error}=await sb.from('site_settings').select('key,value');if(error)return toast(error.message,1);
  const m=Object.fromEntries(data.map(r=>[r.key,r.value]));
  const known=new Set(Object.values(GROUPS).flat());
  const extra=Object.keys(m).filter(k=>!known.has(k));
  const groups={...GROUPS};if(extra.length)groups['Other']=extra;
  $('#view').innerHTML=Object.entries(groups).map(([g,keys])=>`<h3>${g}</h3><div class="card grid">${keys.map(k=>`<div><label>${k}</label>${(m[k]||'').length>70||k==='address'?`<textarea data-k="${k}">${esc(m[k])}</textarea>`:`<input data-k="${k}" value="${esc(m[k])}">`}</div>`).join('')}</div>`).join('')
   +`<div class="row"><button class="b" id="sv">Save all settings</button><button class="g" id="addk">+ New key</button></div>`;
  $('#sv').onclick=async()=>{const rows=[...document.querySelectorAll('[data-k]')].map(e=>({key:e.dataset.k,value:e.value,updated_at:new Date().toISOString()}));
    const {error}=await sb.from('site_settings').upsert(rows);toast(error?error.message:'Settings saved',!!error)};
  $('#addk').onclick=async()=>{const k=prompt('New setting key (letters, numbers, underscore):');if(!k||!/^\w+$/.test(k))return;
    await sb.from('site_settings').upsert({key:k,value:''});settings()};
}

/* ---------- generic list editor ---------- */
function listEditor({table,title,fields,defaults,order='sort_order',groupBy,hint}){
  return async()=>{
    const {data,error}=await sb.from(table).select('*').order(groupBy||order).order(order);if(error)return toast(error.message,1);
    const cell=(r,f)=>f.type==='bool'?`<input type="checkbox" data-f="${f.k}" ${r[f.k]?'checked':''} style="width:auto">`
      :f.type==='select'?`<select data-f="${f.k}">${f.opts.map(o=>`<option ${r[f.k]===o?'selected':''}>${o}</option>`).join('')}</select>`
      :f.type==='area'?`<textarea data-f="${f.k}">${esc(r[f.k])}</textarea>`
      :`<input data-f="${f.k}" ${f.type==='num'?'type="number"':''} value="${esc(r[f.k])}">`;
    $('#view').innerHTML=`<div class="row"><h3 class="sp" style="margin:0">${title}</h3><button class="b" id="new">+ Add</button></div>${hint?`<p class="mut">${hint}</p>`:''}`
     +data.map(r=>`<div class="card" data-id="${r.id}"><div class="grid">${fields.map(f=>`<div style="${f.wide?'grid-column:1/-1':''}"><label>${f.label||f.k}</label>${cell(r,f)}</div>`).join('')}</div>
       ${table==='site_team'?`<p><img class="ph" src="${esc(drive(r.photo_url))}" onerror="this.style.opacity=.2"></p>`:''}
       <p class="row"><button class="b sv">Save</button><button class="d dl">Delete</button></p></div>`).join('');
    $('#new').onclick=async()=>{const {error}=await sb.from(table).insert(defaults);toast(error?error.message:'Added',!!error);if(!error)show(tab)};
    document.querySelectorAll('.card[data-id]').forEach(c=>{
      c.querySelector('.sv').onclick=async()=>{const row={};c.querySelectorAll('[data-f]').forEach(e=>{row[e.dataset.f]=e.type==='checkbox'?e.checked:e.type==='number'?+e.value:e.value});
        const {error}=await sb.from(table).update(row).eq('id',c.dataset.id);toast(error?error.message:'Saved',!!error)};
      c.querySelector('.dl').onclick=async()=>{if(!confirm('Delete this row?'))return;const {error}=await sb.from(table).delete().eq('id',c.dataset.id);toast(error?error.message:'Deleted',!!error);if(!error)show(tab)};
    });
  }}
const nav=listEditor({table:'site_nav',title:'Navigation links',defaults:{label:'New link',url:'#',location:'both',sort_order:99,visible:true},
  fields:[{k:'label'},{k:'url'},{k:'location',type:'select',opts:['header','footer','both']},{k:'sort_order',label:'order',type:'num'},{k:'visible',type:'bool'}]});
const pages=listEditor({table:'site_pages',title:'Page sections',groupBy:'page',defaults:{page:'home',heading:'New section',body:'',sort_order:99,visible:true},
  hint:'Page = home, about, terms, privacy. Body supports **bold** and "- " bullet lines. Rows are shown in page, then order.',
  fields:[{k:'page'},{k:'sort_order',label:'order',type:'num'},{k:'heading'},{k:'link'},{k:'visible',type:'bool'},{k:'body',type:'area',wide:1}]});
const team=listEditor({table:'site_team',title:'Team members',defaults:{name:'New member',role:'',sort_order:99,visible:true},
  fields:[{k:'name'},{k:'role'},{k:'sort_order',label:'order',type:'num'},{k:'photo_url',label:'photo url (Drive links work)'},{k:'linkedin'},{k:'visible',type:'bool'},{k:'bio',type:'area',wide:1}]});
const highlights=listEditor({table:'site_highlights',title:'Highlights',defaults:{value:'0',label:'New highlight',sort_order:99,visible:true},
  hint:'Value can be text ("Hourly") or a number. Plain text only — the old auto:startups formula is dropped.',
  fields:[{k:'value'},{k:'label'},{k:'sort_order',label:'order',type:'num'},{k:'visible',type:'bool'}]});

/* ---------- Missed searches ---------- */
async function misses(){
  const {data,error}=await sb.from('search_misses').select('*').order('hits',{ascending:false}).order('last_seen',{ascending:false}).limit(500);
  if(error)return toast(error.message,1);
  const fmt=d=>new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  $('#view').innerHTML=`<div class="row"><h3 class="sp" style="margin:0">Searches that found nothing</h3>
   <select id="flt" style="width:auto"><option value="new">New</option><option value="all">All</option><option value="added">Added</option><option value="ignored">Ignored</option></select>
   <button class="g" id="csv">Export CSV</button></div>
   <p class="mut">Each term is counted once per visitor visit. No names, IPs or accounts are stored. Mark "added" after you list a matching startup.</p>
   <div class="card"><table><thead><tr><th>Search</th><th>Times</th><th>Last</th><th>Status</th><th></th></tr></thead><tbody id="mb"></tbody></table></div>`;
  const draw=()=>{const f=$('#flt').value;const rows=data.filter(r=>f==='all'||r.status===f);
    $('#mb').innerHTML=rows.map(r=>`<tr data-t="${esc(r.term)}"><td><b>${esc(r.term)}</b></td><td>${r.hits}</td><td class="mut">${fmt(r.last_seen)}</td>
      <td><span class="pill">${r.status}</span></td><td class="row"><button class="g" data-s="added">Added</button><button class="g" data-s="ignored">Ignore</button><button class="d" data-s="del">✕</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">Nothing here.</td></tr>';
    $('#mb').querySelectorAll('button').forEach(b=>b.onclick=async()=>{const t=b.closest('tr').dataset.t;
      const {error}=b.dataset.s==='del'?await sb.from('search_misses').delete().eq('term',t):await sb.from('search_misses').update({status:b.dataset.s}).eq('term',t);
      if(error)return toast(error.message,1);misses();renderTabs()})};
  $('#flt').onchange=draw;draw();
  $('#csv').onclick=()=>{const l=['term,hits,first_seen,last_seen,status',...data.map(r=>[JSON.stringify(r.term),r.hits,r.first_seen,r.last_seen,r.status].join(','))].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([l],{type:'text/csv'}));a.download='missed-searches.csv';a.click()};
}
boot();
</script></body></html>
