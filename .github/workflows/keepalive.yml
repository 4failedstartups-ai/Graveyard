# Pings the database every 3 days so the free Supabase project never pauses from inactivity.
# Uses only the public (anon) key that is already in assets/js/data.js, so no secrets are needed.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one harmless row
        run: |
          curl -fsS "https://uveospgmehgarerlquav.supabase.co/rest/v1/site_settings?key=eq.keepalive&select=key" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2ZW9zcGdtZWhnYXJlcmxxdWF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMTk4NDAsImV4cCI6MjExMDU5NTg0MH0.yM4-8cod1TkXtxJHZNXqyWOsaL7EPZqkEk07Sb9XrCc" -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2ZW9zcGdtZWhnYXJlcmxxdWF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMTk4NDAsImV4cCI6MjExMDU5NTg0MH0.yM4-8cod1TkXtxJHZNXqyWOsaL7EPZqkEk07Sb9XrCc"
