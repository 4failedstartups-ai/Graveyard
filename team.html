<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team</title>
<script src="preloader.js"></script>
<link rel="stylesheet" href="site.css?v=6">
<style>/* critical nav styles: keep the header the right size even before site.css arrives */
@view-transition{navigation:none}
.ul-nav{position:sticky;top:0;z-index:200;view-transition-name:none!important}
.ul-nav-in{display:flex;align-items:center;gap:28px;max-width:1180px;margin:0 auto;padding:0 24px;height:64px!important;max-height:64px}
.ul-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#221E1A;font:500 19px Georgia,serif}
.ul-mark{display:block;width:34px;height:34px;flex:none}.ul-mark img{display:block;width:34px;height:34px;object-fit:contain}
.ul-links{display:flex;gap:4px;margin-left:auto}.ul-links a{color:#6E6656;text-decoration:none;font-size:14px;padding:8px 13px}
.ul-burger{display:none}.ul-foot-in img,.ul-foot .ul-mark img{width:34px;height:34px}</style>
<script src="site.js" defer></script>
</head>
<body data-page="team">
<main id="ul-root"></main>
</body>
</html>
