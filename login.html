<html lang="en"><head>

<style>
:root{--paper:#E8E1D3;--card:#F1ECE0;--ink:#221E1A;--dim:#6b645a;--rust:#8C3B2E;--line:#cfc6b4;--ok:#4d7a52;--warn:#b07a1f;--bad:#a23b2c}
*{box-sizing:border-box}html{background:var(--paper)}
body{margin:0;font:14px/1.5 "Space Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:Georgia,"Fraunces",serif;font-weight:500;margin:0}
.mono,code,.k{font-family:"IBM Plex Mono",ui-monospace,monospace}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#fbf8f1;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rust);outline-offset:-1px}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--ink);color:#f6f1e6;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#000}.btn.rust{background:var(--rust)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.danger{background:var(--bad)}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;box-shadow:6px 6px 0 #d6cdb9}
.lbox h1{font-size:26px;margin-bottom:4px}.lbox p{color:var(--dim);margin:0 0 18px}
.lbox label{display:block;margin:12px 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.err{color:var(--bad);min-height:20px;margin-top:10px;font-size:13px}
header.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
header.top h1{font-size:20px;flex:0 0 auto}header.top .sp{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:53px;z-index:19}
nav.tabs button{background:none;border:0;padding:11px 14px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--rust)}
nav.tabs .n{font:11px "IBM Plex Mono",monospace;background:var(--ink);color:#fff;border-radius:9px;padding:1px 6px;margin-left:5px}
main{padding:20px;max-width:1280px;margin:0 auto}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.stat b{display:block;font:500 28px Georgia,serif}.stat span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.row>.grow{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{background:#e2dac9;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);position:sticky;top:0}
tr:hover td{background:#f6f1e6}td.nm{font-weight:600}.tw{overflow:auto;max-height:68vh;border-radius:8px}
.pill{display:inline-block;font:11px "IBM Plex Mono",monospace;padding:2px 8px;border-radius:10px;border:1px solid var(--line)}
.pill.published{background:#dfeadb;color:var(--ok);border-color:#b7cfb2}.pill.pending{background:#f4e8cc;color:var(--warn);border-color:#e3cf9d}
.pill.lead{background:#e5e0f0;color:#5a4a8a;border-color:#cbc2e3}.pill.hidden{background:#e8e2d7;color:var(--dim)}
.pill.bad{background:#f3d9d3;color:var(--bad);border-color:#e3b5ab}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;border-radius:16px;padding:4px 12px;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ov{position:fixed;inset:0;background:rgba(34,30,26,.55);display:none;z-index:50;overflow:auto;padding:30px 14px}.ov.open{display:block}
.modal{background:var(--card);border-radius:10px;max-width:820px;margin:0 auto;padding:22px;border:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 14px}.fg .wide{grid-column:1/-1}
.fg label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:99;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}.toast.bad{background:var(--bad)}
.muted{color:var(--dim)}.small{font-size:12px}pre.p{white-space:pre-wrap;background:#fbf8f1;border:1px solid var(--line);border-radius:6px;padding:12px;max-height:300px;overflow:auto;font:12px/1.5 "IBM Plex Mono",monospace}
ol.how{padding-left:18px;margin:6px 0}ol.how li{margin:4px 0}
@media(max-width:700px){main{padding:12px}th:nth-child(n+4),td:nth-child(n+4){display:none}.tbl-wide th,.tbl-wide td{display:table-cell!important}}
</style></head><body>

// ---------- helpers shared with the import tool ----------
const nameKey=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"");
function usd(s){s=String(s||"").trim();if(!s||/not publicly|n\/?a|unknown/i.test(s))return null;const t=s.toLowerCase().replace(/,/g,"");
 const nums=t.match(/\d+(?:\.\d+)?/g);if(!nums)return null;const range=/\d\s*-\s*\d/.test(t);const v=range?(+nums[0]+ +nums[1])/2:+nums[0];
 if(/crore|\bcr\b/.test(t))return Math.round(v*1e7/85);if(/lakh|\blac\b/.test(t))return Math.round(v*1e5/85);
 const inr=/₹|^inr|\brs\b/i.test(s);const um=t.match(/\d\s*(billion|bn|b|million|mn|mm|m|thousand|k)\b/);let m=1;
 if(um){const u=um[1];m=["billion","bn","b"].includes(u)?1e9:["million","mn","mm","m"].includes(u)?1e6:1e3}
 const val=v*m;return inr?Math.round(val/85):Math.round(val)}
function names(s){return String(s||"").split(/,|;|\band\b|&|\n/).map(x=>x.trim()).filter(x=>x&&!/not (publicly|found|available)|leadership|team$|unknown|n\/a/i.test(x))}
function money(n){n=+n||0;return n>=1e9?"$"+(n/1e9).toFixed(2)+"B":n>=1e6?"$"+Math.round(n/1e6).toLocaleString("en-US")+"M":n>=1e3?"$"+Math.round(n/1e3)+"K":n?"$"+n:"—"}
const MAP={};Object.keys(CITIES).forEach(st=>{MAP[st.toLowerCase()]=st;CITIES[st].split(",").forEach(c=>MAP[c.trim()]=st)});
const norm=s=>String(s||"").toLowerCase().replace(/\(.*?\)/g," ").replace(/&/g," and ").replace(/[^a-z\s,/-]/g," ").replace(/\s+/g," ").trim();
const KEYS=Object.keys(MAP).filter(k=>k.length>3).sort((a,b)=>b.length-a.length).map(k=>[new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b"),MAP[k]]);
function stateOf(hq){const n=norm(hq);if(!n)return null;if(MAP[n])return MAP[n];for(const p of n.split(/[,/-]/).map(x=>x.trim()).filter(Boolean))if(MAP[p])return MAP[p];for(const[re,st]of KEYS)if(re.test(n))return st;return null}

["funding_amount","Funding (as written)","text"],["funding_usd","Funding in USD (auto)","number"],["funding_stage","Funding stage","text"],["business_model","Business model","text"],
["founders","Founders (comma separated)","list","wide"],["sector","Sector","text"],["team_size","Team size","text"],["competitors","Primary competition","text","wide"],["key_investors","Key investors","text","wide"],
["user_base","User base","text"],["logo_url","Logo URL","text"],["website_url","Website URL","text"],["status_text","Status label","text"],["tags","Tags (comma separated)","list","wide"],
["underlying_tech","Underlying tech","text","wide"],["failure_reason","Failure reason","area","wide"],["epitaph","Epitaph / key lesson","area","wide"],["postmortem_url","Post-mortem URL","text"],["source_url","Source URL","text"],["notes","Private notes","area","wide"]];

let S=[],SUBS=[],SUPS=[],view="overview",flt={status:"all",q:""},sortK="name",sortDir=1,user=null;

// ---------- auth ----------
async function boot(){

// ---------- overview ----------
function overview(){
  const pub=S.filter(r=>r.status==="published");
  const cap=pub.reduce((a,r)=>a+(+r.funding_usd||0),0);
  const lives=pub.map(r=>r.founded_year&&r.shutdown_year&&r.shutdown_year>=r.founded_year?r.shutdown_year-r.founded_year:null).filter(x=>x!==null);

   <div class="card stat"><b>${cnt("pending")}</b><span>Waiting for review</span></div>

   <div class="card stat"><b>${lives.length?(lives.reduce((a,b)=>a+b,0)/lives.length).toFixed(1)+" yr":"—"}</b><span>Avg lifespan</span></div>
   <div class="card stat"><b>₹${tot.toLocaleString("en-IN")}</b><span>Beer money received</span></div></div>
  <div class="grid g2" style="margin-top:14px">
   <div class="card"><h3>Heat-map placement</h3><p class="muted small">Public site hides this line. It lives here.</p>
    <p><b>${placed} of ${pub.length}</b> startups placed on the map.</p>
    ${Object.keys(unp).length?`<p class="small"><b>Not placed:</b> ${Object.entries(unp).map(([k,v])=>esc(k)+(v>1?" ×"+v:"")).join(", ")}</p><p class="muted small">Fix by editing the Headquarters to a recognised city or state.</p>`:`<p class="small" style="color:var(--ok)">Every headquarters is recognised.</p>`}</div>
   <div class="card"><h3>Data quality (published)</h3><table style="margin-top:8px">${dq.map(([k,n])=>`<tr><td>${k}</td><td style="text-align:right"><span class="pill ${n?"pending":"published"}">${n} missing</span></td></tr>`).join("")}</table></div></div>
  <div class="card" style="margin-top:14px"><h3>Rules</h3>
   <div class="row" style="margin-top:10px"><label class="grow">Only add companies founded within the last <input id="maxAge" type="number" min="1" max="60" style="width:80px;display:inline-block"> years (AI import checks this)</label><button class="btn sm" id="saveAge">Save</button></div>
   <div class="row"><button class="btn ghost sm" id="disc">Find new leads from competitor lists</button><span class="muted small">Adds any competitor not yet in the database as a lead. Duplicates are ignored automatically.</span></div></div>`;
  sb.from("app_settings").select("value").eq("key","max_age_years").maybeSingle().then(r=>$("#maxAge").value=(r.data&&r.data.value)||10);
  $("#saveAge").onclick=async()=>{const{error}=await sb.from("app_settings").upsert({key:"max_age_years",value:String($("#maxAge").value||10)});toast(error?error.message:"Saved",!!error)};
  $("#disc").onclick=async()=>{const n=await discover(S);await loadAll();toast(n?n+" new lead"+(n>1?"s":"")+" added":"No new competitors found");overview()};
}
// competitor discovery: every competitor name not already in the database becomes a lead
async function discover(rows){
  const have=new Set(S.map(r=>r.name_key||nameKey(r.name)));const add=[];
  rows.forEach(r=>names(r.competitors).forEach(c=>{const k=nameKey(c);if(k&&c.length<60&&!have.has(k)){have.add(k);add.push({name:c,status:"lead",added_by:"competitor",source_url:null})}}));
  if(!add.length)return 0;
  const{error}=await sb.from("startups").upsert(add,{onConflict:"name_key",ignoreDuplicates:true});
  if(error){toast(error.message,1);return 0}return add.length;
}
async function syncFounders(list){
  const n=[...new Set((list||[]).filter(Boolean))];if(!n.length)return;
  await sb.from("founders").upsert(n.map(name=>({name})),{onConflict:"name",ignoreDuplicates:true});
}

// ---------- startups list ----------
function list(status){
  flt.status=status;const base=S.filter(r=>r.status===status);
  const titles={published:"Published startups",pending:"Review queue",lead:"Competitor leads"};
  const hint={published:"These are live on the website.",pending:"Added by AI, imports or visitors. Nothing here is public until you publish it.",lead:"Names of competitors waiting to be researched. Use AI import → Research leads."}[status];
  $("#view").innerHTML=`<div class="row"><h2 class="grow">${titles[status]} <span class="muted small mono">${base.length}</span></h2><button class="btn rust" id="add">+ Add startup</button></div>
   <p class="muted" style="margin-top:-4px">${hint}</p>
   <div class="row"><input class="grow" id="q" placeholder="Search name, sector, founder, city…" value="${esc(flt.q)}">
   ${status==="published"?"":`<button class="btn sm" id="bulkPub">Publish selected</button>`}<button class="btn ghost sm" id="bulkHide">${status==="hidden"?"":"Hide selected"}</button><button class="btn danger sm" id="bulkDel">Delete selected</button></div>
   <div class="tw"><table class="tbl-wide"><thead><tr><th><input type="checkbox" id="all"></th>${[["name","Name"],["sector","Sector"],["founded_year","Founded"],["shutdown_year","Closed"],["funding_usd","Funding"],["status","Status"]].map(([k,l])=>`<th data-s="${k}" style="cursor:pointer">${l}${sortK===k?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")}<th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw=()=>{const q=flt.q.toLowerCase();
    let r=base.filter(x=>!q||[x.name,x.sector,x.headquarters,(x.founders||[]).join(" "),x.tagline].join(" ").toLowerCase().includes(q));
    r.sort((a,b)=>{const x=a[sortK]??"",y=b[sortK]??"";return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y)))*sortDir});
    $("#tb").innerHTML=r.map(x=>`<tr><td><input type="checkbox" class="sel" value="${x.id}"></td><td class="nm">${esc(x.name)}</td><td>${esc(x.sector||"")}</td><td class="mono">${x.founded_year||""}</td><td class="mono">${x.shutdown_year||""}</td><td class="mono">${x.funding_usd!=null?money(x.funding_usd):`<span class="muted">${esc(x.funding_amount||"")}</span>`}</td><td><span class="pill ${x.status}">${x.status}</span></td><td style="white-space:nowrap"><button class="btn ghost sm" data-e="${x.id}">Edit</button> ${x.status==="published"?`<button class="btn ghost sm" data-h="${x.id}">Hide</button>`:`<button class="btn sm" data-p="${x.id}">Publish</button>`}</td></tr>`).join("")||`<tr><td colspan="8" class="muted" style="padding:24px">Nothing here.</td></tr>`;
    $("#tb").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(b.dataset.e));
    $("#tb").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>setStatus([b.dataset.p],"published"));
    $("#tb").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>setStatus([b.dataset.h],"hidden"));
  };
  draw();
  $("#q").oninput=e=>{flt.q=e.target.value;draw()};
  $("#view").querySelectorAll("th[data-s]").forEach(t=>t.onclick=()=>{sortDir=sortK===t.dataset.s?-sortDir:1;sortK=t.dataset.s;list(status)});
  $("#all").onchange=e=>document.querySelectorAll(".sel").forEach(c=>c.checked=e.target.checked);
  const picked=()=>[...document.querySelectorAll(".sel:checked")].map(c=>c.value);
  $("#add").onclick=()=>edit(null,status);
  if($("#bulkPub"))$("#bulkPub").onclick=()=>picked().length?setStatus(picked(),"published"):toast("Select rows first",1);
  $("#bulkHide").onclick=()=>picked().length?setStatus(picked(),"hidden"):toast("Select rows first",1);
  $("#bulkDel").onclick=async()=>{const p=picked();if(!p.length)return toast("Select rows first",1);if(!confirm("Delete "+p.length+" row(s) permanently?"))return;
    const{error}=await sb.from("startups").delete().in("id",p);if(error)return toast(error.message,1);await loadAll();go(view);toast("Deleted")};
}
async function setStatus(ids,st){
  const{error}=await sb.from("startups").update({status:st}).in("id",ids);if(error)return toast(error.message,1);
  await sb.from("activity_log").insert({actor:user.email,action:"status:"+st,detail:{ids}});
  if(st==="published"){await discover(S.filter(r=>ids.includes(r.id)))}
  await loadAll();go(view);toast(ids.length+" → "+st)}

// ---------- edit modal ----------
function openModal(h){$("#modal").innerHTML=h;$("#ov").classList.add("open")}
function closeModal(){$("#ov").classList.remove("open")}
$("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function edit(id,defStatus){
  const r=id?S.find(x=>x.id===id):{status:defStatus||"pending",status_text:"Failed",founders:[],tags:[]};
  openModal(`<div class="row"><h2 class="grow">${id?"Edit":"Add"} startup</h2><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
  <form id="ef"><div class="fg">${F.map(([k,l,t,w])=>{const v=Array.isArray(r[k])?r[k].join(", "):(r[k]??"");
   return `<div class="${w||""}"><label for="f_${k}">${l}</label>${t==="area"?`<textarea id="f_${k}" name="${k}">${esc(v)}</textarea>`:`<input id="f_${k}" name="${k}" type="${t==="number"?"number":"text"}" value="${esc(v)}">`}</div>`}).join("")}
   <div><label for="f_status">Visibility</label><select id="f_status" name="status">${STATUSES.map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select></div></div>
  <div class="row" style="margin-top:16px"><button class="btn rust">Save</button>${id?`<button type="button" class="btn danger sm" id="del">Delete</button>`:""}<span class="muted small">Funding in USD fills itself from “Funding (as written)” if left blank. Founders are added to the founders directory automatically.</span></div></form>`);
  $("#ef").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o={};
    F.forEach(([k,l,t])=>{let v=(fd.get(k)||"").toString().trim();
      if(t==="number")o[k]=v===""?null:+v;else if(t==="list")o[k]=v?v.split(",").map(x=>x.trim()).filter(Boolean):[];else o[k]=v===""?null:v});
    o.status=fd.get("status");
    if(!o.name)return toast("Name is required",1);
    if(o.funding_usd==null&&o.funding_amount)o.funding_usd=usd(o.funding_amount);
    if(id&&r.funding_amount!==o.funding_amount&&fd.get("funding_usd")==String(r.funding_usd??"")&&o.funding_amount)o.funding_usd=usd(o.funding_amount);
    const q=id?sb.from("startups").update(o).eq("id",id):sb.from("startups").insert(o);
    const{error}=await q;
    if(error)return toast(error.code==="23505"?"A startup with this name already exists.":error.message,1);
    await syncFounders(o.founders);await sb.from("activity_log").insert({actor:user.email,action:id?"edit":"add",detail:{name:o.name}});
    closeModal();await loadAll();await discover([o]);await loadAll();go(view);toast("Saved")};
  if(id)$("#del").onclick=async()=>{if(!confirm("Delete "+r.name+" permanently?"))return;const{error}=await sb.from("startups").delete().eq("id",id);if(error)return toast(error.message,1);closeModal();await loadAll();go(view);toast("Deleted")};
}

// ---------- AI import ----------
const SCHEMA=`{"name":"","tagline":"one sentence","headquarters":"City, State, Country","founded_year":2018,"shutdown_year":2023,"funding_amount":"$5 Mn","funding_usd":5000000,"funding_stage":"Seed","business_model":"","founders":["Full Name"],"sector":"","team_size":"11-50","competitors":"A, B, C","key_investors":"","user_base":"","website_url":"","tags":["tag1","tag2"],"underlying_tech":"","failure_reason":"","epitaph":"one-sentence lesson","postmortem_url":"","source_url":"https://... (REQUIRED, a page that confirms the shutdown)"}`;
let impMode="new",parsed=[];
async function importView(){
  const{data}=await sb.from("app_settings").select("value").eq("key","max_age_years").maybeSingle();const age=+(data&&data.value)||10;
  const leads=S.filter(r=>r.status==="lead");
  $("#view").innerHTML=`<h2>AI import</h2><p class="muted">Works with any free AI (Gemini, ChatGPT, Claude, Perplexity). Copy the prompt, paste it there, copy the answer back here.</p>
  <div class="grid g2"><div class="card"><h3>1 · Make the prompt</h3>
   <div class="row" style="margin-top:10px"><select id="mode" style="max-width:260px"><option value="new">Find new failed startups</option><option value="leads">Research competitor leads</option></select></div>
   <div id="opts"></div><button class="btn rust" id="mk">Generate prompt</button>
   <pre class="p hide" id="pr"></pre><button class="btn ghost sm hide" id="cp" style="margin-top:8px">Copy prompt</button></div>
  <div class="card"><h3>2 · Paste the AI's answer</h3><textarea id="paste" style="min-height:200px" placeholder='Paste the JSON here (a list starting with [ )'></textarea>
   <div class="row" style="margin-top:10px"><button class="btn" id="parse">Check it</button><span class="muted small">Nothing is saved until you press Import.</span></div></div></div>
  <div id="prev" style="margin-top:16px"></div>`;
  const opts=()=>{impMode=$("#mode").value;$("#opts").innerHTML=impMode==="new"
    ?`<div class="fg" style="margin:10px 0"><div><label>How many</label><input id="n" type="number" value="10" min="1" max="30"></div><div><label>Focus (optional)</label><input id="focus" placeholder="e.g. fintech, edtech, 2023 shutdowns"></div></div>`
    :`<p class="small muted">Pick up to 10 leads (${leads.length} waiting):</p><div class="tw" style="max-height:180px;margin-bottom:10px"><table>${leads.map(l=>`<tr><td><input type="checkbox" class="lp" value="${esc(l.name)}"></td><td>${esc(l.name)}</td></tr>`).join("")}</table></div>`};
  $("#mode").onchange=opts;opts();
  $("#mk").onclick=()=>{let t;const known=S.filter(r=>r.status!=="lead").map(r=>r.name).slice(0,600).join(", ");const yr=new Date().getFullYear();
   const rules=`RULES
- Indian startups only (or startups with a clear India link). Real companies only. Never invent a company, a number, a founder or a link.
- Founded in ${yr-age} or later (not older than ${age} years). The company must have actually shut down or been wound up.
- "source_url" is required and must be a real article/filing that confirms the shutdown. If you cannot find one, leave the company out.
- If a field is unknown use null (or [] for lists). funding_usd is a plain number in US dollars (convert rupees at about 85 per dollar); funding_amount keeps the original wording.
- founders: one full name per array item.
- Output ONLY a JSON array. No commentary, no markdown fences.

Each item must follow this shape:
${SCHEMA}`;
   if(impMode==="new"){const n=$("#n").value||10,f=$("#focus").value.trim();
    t=`Act as a careful researcher for "The Startup Graveyard", a site documenting failed Indian startups.\n\nFind ${n} failed startups${f?" focused on: "+f:""} that are NOT in this list already:\n${known}\n\n${rules}`}
   else{const p=[...document.querySelectorAll(".lp:checked")].map(c=>c.value).slice(0,10);if(!p.length)return toast("Tick at least one lead",1);
    t=`Act as a careful researcher for "The Startup Graveyard", a site documenting failed Indian startups.\n\nFor each company below, check whether it has shut down. Return an entry ONLY for those that have actually shut down; skip the rest.\nCompanies: ${p.join(", ")}\n\n${rules}`}
   $("#pr").textContent=t;$("#pr").classList.remove("hide");$("#cp").classList.remove("hide")};
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText($("#pr").textContent);toast("Prompt copied")}catch(e){toast("Select and copy it manually",1)}};
  $("#parse").onclick=()=>check(age);
}
function check(age){
  let txt=$("#paste").value.trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a=txt.indexOf("["),b=txt.lastIndexOf("]");if(a<0||b<0)return toast("Could not find a [ ... ] list in that text.",1);
  let arr;try{arr=JSON.parse(txt.slice(a,b+1))}catch(e){return toast("That is not valid JSON: "+e.message,1)}
  if(!Array.isArray(arr)||!arr.length)return toast("The list is empty.",1);
  const byKey=new Map(S.map(r=>[r.name_key||nameKey(r.name),r])),seen=new Set(),yr=new Date().getFullYear();
  parsed=arr.map(x=>{const o={};F.forEach(([k,l,t])=>{let v=x[k];if(t==="list")o[k]=Array.isArray(v)?v.map(String):v?names(v):[];else if(t==="number")o[k]=v==null||v===""?null:(+v||null);else o[k]=v==null||v===""?null:String(v).trim()});
    if(Array.isArray(x.competitors))o.competitors=x.competitors.join(", ");
    if(o.funding_usd==null&&o.funding_amount)o.funding_usd=usd(o.funding_amount);
    const k=nameKey(o.name),ex=byKey.get(k);let st="new",why="",ok=true;
    if(!o.name){st="invalid";why="no name";ok=false}
    else if(seen.has(k)){st="duplicate";why="repeated in this list";ok=false}
    else if(ex&&ex.status==="lead"){st="fills lead";why="will complete the lead you already have"}
    else if(ex){st="duplicate";why="already "+ex.status;ok=false}
    else if(!o.source_url){st="no source";why="missing source_url";ok=false}
    if(ok&&o.founded_year&&o.founded_year<yr-age){st="too old";why="founded "+o.founded_year+" (limit "+(yr-age)+")";ok=false}
    seen.add(k);o._st=st;o._why=why;o._ex=ex;o._ok=ok;return o});
  $("#prev").innerHTML=`<div class="card"><h3>3 · Check and import</h3><p class="muted small">Ticked rows go in as <b>Pending</b> for your review. Untick anything you don't want. Greyed rows were skipped by the rules, you can still tick them.</p>
  <div class="tw"><table><thead><tr><th></th><th>Name</th><th>Founded</th><th>Closed</th><th>Funding</th><th>Result</th></tr></thead><tbody>${parsed.map((o,i)=>`<tr style="${o._ok?"":"opacity:.6"}"><td><input type="checkbox" class="ip" value="${i}" ${o._ok?"checked":""}></td><td class="nm">${esc(o.name)}</td><td class="mono">${o.founded_year||""}</td><td class="mono">${o.shutdown_year||""}</td><td class="mono">${o.funding_usd!=null?money(o.funding_usd):esc(o.funding_amount||"")}</td><td><span class="pill ${o._ok?"published":"bad"}">${o._st}</span> <span class="muted small">${esc(o._why)}</span></td></tr>`).join("")}</tbody></table></div>
  <div class="row" style="margin-top:12px"><button class="btn rust" id="go">Import ticked rows</button></div></div>`;
  $("#go").onclick=async()=>{const pick=[...document.querySelectorAll(".ip:checked")].map(c=>parsed[+c.value]);if(!pick.length)return toast("Nothing ticked",1);
    $("#go").disabled=true;let ins=0,upd=0,fail=0;
    for(const o of pick){const row={...o};["_st","_why","_ex","_ok"].forEach(k=>delete row[k]);row.status="pending";row.added_by=row.added_by||"ai";if(!row.status_text)row.status_text="Failed";
      if(o._ex&&o._ex.status==="lead"){const{error}=await sb.from("startups").update({...row,name:o._ex.name,added_by:"ai"}).eq("id",o._ex.id);error?fail++:upd++}
      else{row.added_by="ai";const{error}=await sb.from("startups").insert(row);error?fail++:ins++}
      await syncFounders(row.founders)}
    await sb.from("activity_log").insert({actor:user.email,action:"ai-import",detail:{ins,upd,fail}});
    await loadAll();toast(`${ins} added, ${upd} leads completed${fail?", "+fail+" failed":""}`,!!fail);go("review")};
}

// ---------- submissions ----------
function subsView(){
  $("#view").innerHTML=`<h2>Visitor submissions <span class="muted small mono">${SUBS.length}</span></h2><p class="muted">“Submit a postmortem” entries from the website land here. Nothing is public until you turn one into a startup and publish it.</p>
  ${SUBS.map(s=>{const p=s.payload||{};return `<div class="card" style="margin-bottom:10px;${s.reviewed?"opacity:.55":""}"><div class="row" style="margin:0"><b class="grow">${esc(p.startupName||"(no name)")}</b><span class="muted small mono">${new Date(s.created_at).toLocaleString()}</span>${s.reviewed?`<span class="pill">reviewed</span>`:""}</div>
  <p class="small muted" style="margin:4px 0">From ${esc(p.submitterName||"")} · ${esc(p.submitterEmail||"")} · ${esc(p.relationship||"")}</p>
  <p style="margin:6px 0">${esc(p.tagline||"")} ${p.sector?`<span class="pill">${esc(p.sector)}</span>`:""} ${p.foundedYear?esc(p.foundedYear):""}${p.shutdownYear?" → "+esc(p.shutdownYear):""}</p>
  <p class="small">${esc(p.failureReason||"")}</p>${p.notes?`<p class="small muted">${esc(p.notes)}</p>`:""}
  <div class="row" style="margin:8px 0 0"><button class="btn sm" data-c="${s.id}">Make pending startup</button><button class="btn ghost sm" data-r="${s.id}">${s.reviewed?"Mark unread":"Mark reviewed"}</button><button class="btn ghost sm" data-d="${s.id}">Delete</button></div></div>`}).join("")||`<div class="card muted">No submissions yet.</div>`}`;
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const s=SUBS.find(x=>x.id===b.dataset.r);await sb.from("submissions").update({reviewed:!s.reviewed}).eq("id",s.id);await loadAll();subsView()});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this submission?"))return;await sb.from("submissions").delete().eq("id",b.dataset.d);await loadAll();subsView()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{const s=SUBS.find(x=>x.id===b.dataset.c),p=s.payload||{};
    const{error}=await sb.from("startups").insert({name:(p.startupName||"").trim(),tagline:p.tagline||null,sector:p.sector||null,founded_year:+p.foundedYear||null,shutdown_year:+p.shutdownYear||null,website_url:p.startupWebsite||null,failure_reason:p.failureReason||null,notes:`Submitted by ${p.submitterName||""} <${p.submitterEmail||""}> (${p.relationship||""}). ${p.notes||""}`,status:"pending",added_by:"submission",status_text:"Failed"});
    if(error)return toast(error.code==="23505"?"Already in the database":error.message,1);
    await sb.from("submissions").update({reviewed:true}).eq("id",s.id);await loadAll();toast("Added to Review");go("review")});
}

  <div class="tw"><table><thead><tr><th>When</th><th>Name</th><th>Amount</th><th>Payment id</th></tr></thead><tbody>${SUPS.map(s=>`<tr><td class="mono">${new Date(s.created_at).toLocaleString()}</td><td>${esc(s.name)}</td><td class="mono">₹${s.amount}</td><td class="mono muted">${esc(s.payment_id)}</td></tr>`).join("")||`<tr><td colspan="4" class="muted" style="padding:20px">No payments yet.</td></tr>`}</tbody></table></div>`;
}

// ---------- backup ----------
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function backupView(){
  $("#view").innerHTML=`<h2>Backup & export</h2><div class="grid g2" style="margin-top:12px">
  <div class="card"><h3>Download everything</h3><p class="muted small">The free Supabase plan has no automatic backups. Download one now and then.</p><div class="row"><button class="btn" id="bj">Full backup (JSON)</button><button class="btn ghost" id="bc">Startups (CSV)</button></div></div>
  <div class="card"><h3>Restore / bulk add</h3><p class="muted small">Paste a JSON backup list to re-insert rows. Existing names are skipped.</p><textarea id="rs" placeholder="[ {...}, {...} ]"></textarea><div class="row" style="margin-top:8px"><button class="btn ghost" id="rb">Restore</button></div></div></div>`;
  $("#bj").onclick=()=>dl("graveyard-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({startups:S,submissions:SUBS},null,1),"application/json");
  $("#bc").onclick=()=>{const cols=F.map(f=>f[0]).concat(["status"]);const c=v=>`"${String(Array.isArray(v)?v.join(", "):v??"").replace(/"/g,'""')}"`;
    dl("startups-"+new Date().toISOString().slice(0,10)+".csv",[cols.join(",")].concat(S.map(r=>cols.map(k=>c(r[k])).join(","))).join("\n"),"text/csv")};
  $("#rb").onclick=async()=>{let a;try{a=JSON.parse($("#rs").value);a=a.startups||a}catch(e){return toast("Invalid JSON",1)}
    const rows=a.map(r=>{const o={...r};["id","name_key","created_at","updated_at"].forEach(k=>delete o[k]);return o});
    const{error}=await sb.from("startups").upsert(rows,{onConflict:"name_key",ignoreDuplicates:true});if(error)return toast(error.message,1);await loadAll();toast("Restored")};
}
boot();
</script></body></html>
